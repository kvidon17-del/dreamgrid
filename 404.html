<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #070918; --bg2: #0c0f24;
    --border: rgba(255,255,255,0.08);
    --text: #ffffff; --muted: rgba(255,255,255,0.5);
    --grad-title: linear-gradient(135deg,#e0d7ff 0%,#c4b5fd 20%,#f9a8d4 55%,#fcd34d 80%,#fde68a 100%);
    --grad-btn: linear-gradient(135deg,#6d4df0,#9333ea);
    --radius-sm: 10px; --radius: 16px;
  }
  body {
    font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px; position: relative; overflow: hidden;
  }
  body::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse 60% 50% at 50% 20%, rgba(124,92,246,0.18), transparent 70%),
                radial-gradient(ellipse 50% 40% at 80% 80%, rgba(244,114,182,0.10), transparent 70%);
    pointer-events: none;
  }
  .wrap { position: relative; z-index: 1; max-width: 460px; }
  .glyph { font-size: 56px; margin-bottom: 8px; opacity: 0.9; }
  .code {
    font-family: 'Sora', sans-serif; font-weight: 900; font-size: 84px; line-height: 1;
    background: var(--grad-title); -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 12px;
  }
  h1 { font-family: 'Sora', sans-serif; font-size: 24px; font-weight: 800; margin-bottom: 10px; }
  p { color: var(--muted); font-size: 15px; line-height: 1.6; margin-bottom: 32px; }
  .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn-primary, .btn-secondary {
    padding: 13px 26px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600;
    text-decoration: none; display: inline-block; transition: opacity 0.2s, background 0.2s;
    font-family: 'Inter', sans-serif;
  }
  .btn-primary { background: var(--grad-btn); color: #fff; }
  .btn-primary:hover { opacity: 0.88; }
  .btn-secondary { background: rgba(255,255,255,0.06); color: #fff; border: 1px solid var(--border); }
  .btn-secondary:hover { background: rgba(255,255,255,0.1); }
</style>
<style>
/* STARFIELD — тихий фон под всеми страницами сайта (кроме Globe View — там своя 3D-сцена).
   Абсолютное позиционирование на всю высоту страницы, НЕ fixed — так фон часть обычного
   контента и не ловит краевые случаи position:fixed (пропадание при скролле в некоторых
   браузерах, особенно в паре с overflow-x:hidden на body). Тема мечты/ночного неба —
   "загадать желание на падающую звезду" — поэтому это не украшение ради украшения. */
body { position: relative; }
.dg-starfield { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; pointer-events: none; z-index: 0; }
.dg-starfield svg { width: 100%; height: 100%; display: block; }
.dg-star { animation-name: dg-twinkle; animation-timing-function: ease-in-out; animation-iteration-count: infinite; transform-box: fill-box; transform-origin: center; }
@keyframes dg-twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.85; } }
.dg-shooting-star { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; box-shadow: 0 0 6px 1px rgba(255,255,255,0.85); opacity: 0; }
.dg-shooting-star::before { content: ''; position: absolute; top: 50%; right: 0; width: 90px; height: 1px; background: linear-gradient(90deg, rgba(255,255,255,0.8), transparent); transform: translateY(-50%); }
.dg-shooting-star.s1 { left: 18%; top: 6%; animation: dg-shoot 17s linear infinite; animation-delay: 3s; }
.dg-shooting-star.s2 { left: 58%; top: 38%; animation: dg-shoot 23s linear infinite; animation-delay: 10s; }
.dg-shooting-star.s3 { left: 80%; top: 72%; animation: dg-shoot 20s linear infinite; animation-delay: 15s; }
@keyframes dg-shoot {
  0% { opacity: 0; transform: translate(0,0) rotate(35deg); }
  2% { opacity: 1; }
  9% { opacity: 0; transform: translate(-240px, 340px) rotate(35deg); }
  100% { opacity: 0; transform: translate(-240px, 340px) rotate(35deg); }
}
@media (prefers-reduced-motion: reduce) {
  .dg-star { animation: none; opacity: 0.35; }
  .dg-shooting-star { display: none; }
}
</style>
